[project]
name = "agentic-document-extractor"
version = "0.1.0"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "jsonschema>=4.26.0",
    "markdown-it-py>=4.0.0",
    "numpy>=2.5.2",
    "onnx>=1.22.0",
    "onnxruntime-gpu>=1.29.0",
    "openai>=3.6.0",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pypdf>=6.16.2",
    "pypdfium2>=5.13.0",
    "rapidocr",
    "streamlit[pdf]>=1.62.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
agentic-extractor = "agentic_extractor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_extractor"]

[tool.uv.sources]
rapidocr = { git = "https://github.com/RapidAI/RapidOCR.git", subdirectory = "python", rev = "e7edb012372f9ec5cf9e38a1e1e7b6abd489a2e7" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
    "ty>=0.0.75",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=agentic_extractor --cov-report=term-missing --cov-fail-under=80"
markers = ["live: uses the live OpenAI API"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.environment]
python-version = "3.13"
